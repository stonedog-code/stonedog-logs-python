[project]
name = "stonedog-logs"
version = "0.2.0"
description = "Structured logging for Python with optional OpenTelemetry (OTLP) export to providers like Seq"
authors = [
    {name = "Jesse Stone",email = "jesse@stonedogcode.com"}
]
license = {text = "MIT"}
readme = "README.md"
requires-python = ">=3.9,<4.0"

# Core has zero required runtime dependencies — it is a thin wrapper over the
# standard library `logging` module. OpenTelemetry export is opt-in via the
# `otlp` extra so the library stays lightweight on constrained devices.
dependencies = []

[project.optional-dependencies]
otlp = [
    "opentelemetry-sdk>=1.20.0",
    "opentelemetry-exporter-otlp-proto-http>=1.20.0",
]

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

# The source layout is ``src/stonedog_logs`` (import name ``stonedog_logs``,
# distribution name ``stonedog-logs``). Tell poetry-core where to find the
# package so the built wheel/sdist actually contains it.
#
# Published as ``roz-logs`` up to 0.1.0; that distribution stays on PyPI but is
# no longer updated.
[tool.poetry]
packages = [{ include = "stonedog_logs", from = "src" }]

[tool.poetry.group.dev.dependencies]
pytest = "^8.4.0"
pytest-cov = "^6.0.0"
black = "^25.1.0"
isort = "^6.0.1"
flake8 = "^7.2.0"

[tool.pytest.ini_options]
addopts = "-ra -q --cov=stonedog_logs --cov-report=term-missing --cov-fail-under=90"
testpaths = [
    "tests",
]
pythonpath = ["src"]

[tool.coverage.run]
source = ["stonedog_logs"]

[tool.coverage.report]
fail_under = 90
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
    "\\.\\.\\.",
]

[tool.black]
line-length = 88
target-version = ['py39', 'py310', 'py311', 'py312']

[tool.isort]
profile = "black"
line_length = 88
src_paths = ["src", "tests"]
